# Simula um servidor enviando métricas de sistema (host=srv-simulado)
[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "srv-simulado"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
[[inputs.mem]]
[[inputs.system]]
[[inputs.net]]

[[outputs.influxdb]]
  urls = ["http://victoriametrics:8428"]
  database = "telemetria"
  skip_database_creation = true

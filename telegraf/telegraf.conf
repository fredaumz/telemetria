[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# Recebe telemetria Model-Driven (gRPC dial-out) de IOS-XR / IOS-XE / NX-OS
[[inputs.cisco_telemetry_mdt]]
  transport = "grpc"
  service_address = ":57000"
  max_msg_size = 20000000
  # Listas aninhadas viram séries separadas, com o nome do item como tag
  embedded_tags = [
    "Cisco-IOS-XR-wdsysmon-fd-oper:system-monitoring/cpu-utilization/process-cpu/process-name",
  ]
  # Campos texto que não viram métrica (ficam como tag via processors abaixo, ou são descartados)
  fieldexclude = ["encapsulation_type_string", "l2_transport", "parent_interface", "sub_interface_mtu_overhead", "bandwidth64_bit"]
  # Nomes curtos para os sensor-paths
  [inputs.cisco_telemetry_mdt.aliases]
    ifstats = "Cisco-IOS-XR-infra-statsd-oper:infra-statistics/interfaces/interface/latest/generic-counters"
    ifbrief = "Cisco-IOS-XR-pfi-im-cmd-oper:interfaces/interface-briefs/interface-brief"
    cpu     = "Cisco-IOS-XR-wdsysmon-fd-oper:system-monitoring/cpu-utilization"
    cpuproc = "Cisco-IOS-XR-wdsysmon-fd-oper:system-monitoring/cpu-utilization/process-cpu"
    mem     = "Cisco-IOS-XR-nto-misc-oper:memory-summary/nodes/node/summary"

# Estado das interfaces (texto) -> número: 1=up 0=down 2=admin-down 3=outro
# O plugin entrega os campos com "_" (ex.: line_state)
[[processors.enum]]
  namepass = ["ifbrief"]
  [[processors.enum.mapping]]
    field = "state"
    default = 3
    [processors.enum.mapping.value_mappings]
      "im-state-up" = 1
      "im-state-down" = 0
      "im-state-admin-down" = 2
  [[processors.enum.mapping]]
    field = "line_state"
    default = 3
    [processors.enum.mapping.value_mappings]
      "im-state-up" = 1
      "im-state-down" = 0
      "im-state-admin-down" = 2
  [[processors.enum.mapping]]
    field = "actual_state"
    default = 3
    [processors.enum.mapping.value_mappings]
      "im-state-up" = 1
      "im-state-down" = 0
      "im-state-admin-down" = 2
  [[processors.enum.mapping]]
    field = "actual_line_state"
    default = 3
    [processors.enum.mapping.value_mappings]
      "im-state-up" = 1
      "im-state-down" = 0
      "im-state-admin-down" = 2

# Grava no VictoriaMetrics via protocolo Influx
[[outputs.influxdb]]
  urls = ["http://victoriametrics:8428"]
  database = "telemetria"
  skip_database_creation = true

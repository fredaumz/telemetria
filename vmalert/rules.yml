groups:
  - name: interfaces
    interval: 30s
    rules:
      - alert: InterfaceCRCErrors
        expr: (ifstats_crc_errors - ifstats_crc_errors offset 5m) > 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Erros CRC em {{ $labels.source }} {{ $labels.interface_name }}"
          description: "{{ $value }} erros CRC nos últimos 5 minutos"

      # Drops: dispara só se passar de 0,01% dos pacotes da interface em 5 min
      # (e mais de 100 drops, para não alertar interfaces com pouco tráfego).
      - alert: InterfaceInputDrops
        expr: |
          (
            100 * (ifstats_input_drops - ifstats_input_drops offset 5m)
                / clamp_min(ifstats_packets_received - ifstats_packets_received offset 5m, 1)
          ) > 0.01
          and (ifstats_input_drops - ifstats_input_drops offset 5m) > 100
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Drops de entrada em {{ $labels.source }} {{ $labels.interface_name }}"
          description: "{{ printf \"%.3f\" $value }}% dos pacotes recebidos descartados nos últimos 5 minutos"

      - alert: InterfaceOutputDrops
        expr: |
          (
            100 * (ifstats_output_drops - ifstats_output_drops offset 5m)
                / clamp_min(ifstats_packets_sent - ifstats_packets_sent offset 5m, 1)
          ) > 0.01
          and (ifstats_output_drops - ifstats_output_drops offset 5m) > 100
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Drops de saída em {{ $labels.source }} {{ $labels.interface_name }}"
          description: "{{ printf \"%.3f\" $value }}% dos pacotes enviados descartados nos últimos 5 minutos"

  - name: telemetria
    interval: 30s
    rules:
      - alert: RouterTelemetryStale
        expr: (time() - max by (source) (timestamp(ifstats_bytes_received))) > 120
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Sem telemetria de {{ $labels.source }} há mais de 2 minutos"

      # Coleta parcial: o roteador ainda manda, mas chegaram menos de 90% das amostras esperadas
      # (contadores de interface a cada 10 s = 30 em 5 min). offset 1m compensa o atraso dos carimbos
      # do roteador; a 2ª condição ignora roteadores que começaram a enviar há menos de 10 min.
      - alert: RouterTelemetryDegraded
        expr: |
          max by (source) (count_over_time(ifstats_bytes_received[5m] offset 1m)) < 27
          and on(source) max by (source) (count_over_time(ifstats_bytes_received[1m] offset 10m)) > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Coleta parcial de {{ $labels.source }}"
          description: "Só {{ $value }} de 30 amostras esperadas nos últimos 5 minutos (perda de pacotes ou reconexões gRPC)"
